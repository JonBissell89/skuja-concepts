<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Studio dashboard — demo · Skuja Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="admin.css">
<style>
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  .demo-banner{position:sticky;top:0;z-index:40;background:#2f5d50;color:#fff;font:500 14px/1.4 Inter,system-ui,sans-serif;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .demo-banner a,.demo-banner button{color:#fff;background:rgb(255 255 255 / 15%);border:0;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer;text-decoration:none}
  .admin-nav nav a.is-disabled{opacity:.45;pointer-events:none}
  .a-sheet{position:fixed;inset:0;z-index:50;background:var(--a-bg);overflow:auto;display:none;min-height:0}
  .admin.toasts{min-height:0;background:none}
  .admin.a-dialog{min-height:0}
  .a-sheet.open{display:block}
  .a-sheet__inner{max-width:900px;margin:0 auto;padding:20px 16px 120px}
  .a-sheet__top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:var(--a-bg);padding:10px 0;z-index:2}
  .sortable-ghost{opacity:.35}
  .a-kcard{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .a-grip{display:inline-grid;place-items:center;width:28px;height:32px;margin:-6px 2px -6px -6px;border-radius:6px;color:#9a948a;font-size:18px;cursor:grab;touch-action:none;flex:none}
  .a-grip:active{background:var(--a-bg);color:var(--a-ink)}
  @media (pointer:coarse){.a-grip{width:40px;height:40px;font-size:22px}}
  .a-next{border-color:var(--a-accent)!important;color:var(--a-accent)!important}
  .a-board.is-dragging{scroll-snap-type:none}
  /* Phones: columns stacked vertically — drag up/down, the page scrolls with you */
  @media (max-width:820px){
    .a-board{flex-direction:column;overflow:visible;gap:12px;scroll-snap-type:none}
    .a-col,.a-col--compact{flex:none;width:100%;max-height:none}
    .a-done{width:100%}.a-done__cols{flex-direction:column}
    .a-col__list{overflow:visible}
  }
  .sortable-chosen .a-kcard{box-shadow:0 12px 30px rgb(0 0 0 / 18%)}
  .a-col__list{min-height:80px}
  .cust{font-family:"Century Gothic","Questrial",system-ui,sans-serif;background:#EEEDE8;color:#121210;min-height:100vh}
  .cust header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #CFCDC5;font:700 15px/1 "Century Gothic","Questrial",sans-serif;letter-spacing:.06em;text-transform:uppercase}
  .cust main{max-width:1100px;margin:0 auto;padding:40px 20px 80px}
  .cust .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8E8C84}
  .cust h1{font:400 clamp(32px,6vw,64px)/1.05 "Kiona","Josefin Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase;margin:12px 0 16px}
  .cust .bar{height:6px;background:#CFCDC5;max-width:520px;margin:18px 0 32px}
  .cust .bar i{display:block;height:100%;background:#8A8450}
  .cust ol{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px;margin:0 0 40px}
  .cust li{border-top:2px solid #CFCDC5;padding-top:10px}
  .cust li.done{border-color:#8A8450}.cust li.next{border-color:#121210}
  .cust li h3{font:400 18px/1.15 "Kiona","Josefin Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase;margin:6px 0}
  .cust .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .cust .photos img{width:100%;aspect-ratio:4/5;object-fit:cover}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400&family=Questrial&display=swap">
</head>
<body>
<div class="demo-banner" role="note">
  <span><strong>Demo</strong> of Oleg's studio dashboard. Sample customers, nothing is sent or saved anywhere. Try dragging cards, Reply, and opening Jane's job.</span>
  <span><button type="button" id="reset">Reset demo</button> <a href="../final.html">← Website preview</a></span>
</div>

<div class="admin admin-shell" id="app">
  <aside class="admin-nav">
    <a class="admin-nav__brand" href="#">Skuja <span>Studio</span></a>
    <nav aria-label="Dashboard"><ul>
      <li><a href="#" aria-current="page"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16v12H4z M4 7l8 6 8-6"/></svg><span>Inquiries</span><span class="badge" id="newBadge"></span></a></li>
      <li><a href="#" class="is-disabled"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16v14H4z M4 15l5-5 4 4 3-3 4 4"/></svg><span>Projects</span></a></li>
      <li><a href="#" class="is-disabled"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4h12v16H6z M9 8h6 M9 12h6 M9 16h4"/></svg><span>Journal</span></a></li>
      <li><a href="#" class="is-disabled"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1 12H6z M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Products</span></a></li>
      <li><a href="#" class="is-disabled"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M4 12h2 M18 12h2 M12 4v2 M12 18v2"/></svg><span>Settings</span></a></li>
    </ul></nav>
    <div class="admin-nav__foot"><span class="a-muted a-small">oleg@skujadesign.studio · Owner</span></div>
  </aside>
  <main class="admin-main admin-main--wide" id="main">
    <header class="a-head"><div><h1>Customer requests</h1></div></header>
    <div class="a-toolbar">
      <div class="a-tabs" role="tablist">
        <button role="tab" data-view="board" class="is-active" aria-selected="true">Board</button>
        <button role="tab" data-view="jobs" aria-selected="false">Jobs &amp; materials</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="admin a-sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Customer"><div class="a-sheet__inner" id="sheetInner"></div></div>
<div class="a-sheet cust" id="custPage" role="dialog" aria-modal="true" aria-label="Customer progress page"></div>

<dialog class="admin a-dialog a-composer" id="composer" aria-labelledby="cTitle">
  <h2 id="cTitle"></h2>
  <p class="a-hint" id="cTo"></p>
  <label class="a-field"><span>Template</span><select id="cTpl"></select></label>
  <label class="a-field"><span>Subject</span><input id="cSubj"></label>
  <label class="a-field"><span>Message</span><textarea id="cBody" rows="12"></textarea></label>
  <label class="a-check" id="cMoveW"><input type="checkbox" id="cMove" checked><span id="cMoveL"></span></label>
  <div class="a-dialog__actions"><button class="a-btn" id="cCancel" type="button">Cancel</button><button class="a-btn a-btn--primary" id="cSend" type="button">Send email</button></div>
</dialog>
<div class="admin toasts" role="status" aria-live="polite" id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="demo.js"></script>
</body>
</html>
